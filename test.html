<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnergyBe - Map Benchmark Mockup</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #050608; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #FFFFFF; }
        .phone-container { width: 390px; height: 844px; background: #0B0D12; border-radius: 48px; border: 10px solid #1C1E24; box-shadow: 0 30px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 52px 20px 14px; background: linear-gradient(180deg, rgba(11,13,18,0.95) 70%, rgba(11,13,18,0)); position: absolute; top: 0; left: 0; right: 0; z-index: 10; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
        .profile-icon { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); display: flex; align-items: center; justify-content: center; font-size: 14px; border: 1px solid rgba(255, 255, 255, 0.15); }
        .subtitle { font-size: 13px; color: #8E8E93; margin-bottom: 14px; }
        .toggle-bar { display: flex; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); border-radius: 12px; padding: 3px; gap: 4px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .toggle-btn { flex: 1; padding: 8px 0; border: none; background: transparent; color: #8E8E93; font-weight: 600; font-size: 14px; border-radius: 9px; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .toggle-btn.active.electricity { background: rgba(10, 132, 255, 0.22); color: #2997FF; box-shadow: 0 0 12px rgba(10, 132, 255, 0.35), inset 0 0 0 1px rgba(41, 151, 255, 0.4); }
        .toggle-btn.active.gas { background: rgba(255, 159, 10, 0.22); color: #FF9F0A; box-shadow: 0 0 12px rgba(255, 159, 10, 0.35), inset 0 0 0 1px rgba(255, 159, 10, 0.4); }
        .map-viewport { flex: 1; width: 100%; height: 100%; background-color: #080A0E; position: relative; }
        .map-svg { width: 100%; height: 100%; }
        .region-path { stroke-width: 1.5; cursor: pointer; transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
        .region-path:hover { filter: brightness(1.25); }
        .region-label { font-size: 10px; font-weight: 600; fill: rgba(255, 255, 255, 0.75); pointer-events: none; text-anchor: middle; letter-spacing: 0.2px; }
        .home-pin { position: absolute; top: 250px; left: 145px; pointer-events: none; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); z-index: 5; }
        .pin-badge { background: rgba(11, 13, 18, 0.85); border: 1px solid rgba(255, 255, 255, 0.25); backdrop-filter: blur(10px); color: #FFF; padding: 3px 9px; border-radius: 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.3px; white-space: nowrap; margin-bottom: 4px; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
        .pin-dot { width: 12px; height: 12px; background: #30D158; border: 2px solid #FFFFFF; border-radius: 50%; box-shadow: 0 0 12px #30D158; }
        .bottom-sheet { position: absolute; bottom: 72px; left: 12px; right: 12px; background: rgba(18, 20, 26, 0.88); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 16px 18px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); z-index: 10; transition: all 0.3s ease; }
        .sheet-handle { width: 36px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; margin: 0 auto 12px; }
        .stats-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .stats-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: #8E8E93; font-weight: 600; }
        .selected-region-name { font-size: 18px; font-weight: 700; color: #FFF; margin-top: 2px; }
        .main-stat { text-align: right; }
        .user-val { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; transition: color 0.3s ease; }
        .user-unit { font-size: 12px; font-weight: 500; color: #8E8E93; }
        .bar-container { margin: 10px 0 14px; }
        .bar-bg { height: 8px; background: rgba(255, 255, 255, 0.08); border-radius: 4px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; width: 43%; border-radius: 4px; transition: width 0.5s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease; }
        .bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: #8E8E93; margin-top: 6px; font-weight: 500; }
        .badges-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .badge-card { background: rgba(48, 209, 88, 0.12); border: 1px solid rgba(48, 209, 88, 0.25); padding: 10px 12px; border-radius: 14px; transition: all 0.3s ease; }
        .badge-card.amber { background: rgba(255, 159, 10, 0.12); border-color: rgba(255, 159, 10, 0.25); }
        .badge-value { font-size: 15px; font-weight: 700; color: #30D158; display: flex; align-items: center; gap: 4px; }
        .badge-card.amber .badge-value { color: #FF9F0A; }
        .badge-sub { font-size: 10px; color: #8E8E93; margin-top: 2px; }
        .legend { display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.35); padding: 6px 12px; border-radius: 10px; margin-top: 12px; font-size: 10px; color: #8E8E93; border: 1px solid rgba(255,255,255,0.05); }
        .legend-gradient { flex: 1; height: 4px; border-radius: 2px; margin: 0 10px; transition: background 0.3s ease; }
        .navbar { position: absolute; bottom: 0; left: 0; right: 0; height: 65px; background: #0B0D12; border-top: 1px solid rgba(255, 255, 255, 0.08); display: flex; justify-content: space-around; align-items: center; padding-bottom: 12px; z-index: 20; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #636366; cursor: pointer; }
        .nav-item.active { color: #FFFFFF; }
        .nav-icon { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="header">
        <div class="header-top">
            <h1>Benchmark</h1>
            <div class="profile-icon">👤</div>
        </div>
        <div class="subtitle">See where your home stands locally</div>
        <div class="toggle-bar">
            <button class="toggle-btn active electricity" id="btn-elec" onclick="setEnergyType('electricity')">⚡ Electricity</button>
            <button class="toggle-btn gas" id="btn-gas" onclick="setEnergyType('gas')">🔥 Gas</button>
        </div>
    </div>

    <div class="map-viewport">
        <div class="home-pin">
            <div class="pin-badge">Your Home</div>
            <div class="pin-dot"></div>
        </div>
        <svg class="map-svg" viewBox="0 0 390 550">
            <defs>
                <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
                    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="#080A0E" />
            <rect width="100%" height="100%" fill="url(#grid)" />
            <path id="region-dilbeek" class="region-path" d="M 60,180 L 170,160 L 210,240 L 160,330 L 70,300 Z" onclick="selectRegion('dilbeek')"/>
            <text x="130" y="240" class="region-label">Dilbeek (1700)</text>
            <path id="region-groot" class="region-path" d="M 80,80 L 190,70 L 170,160 L 60,180 Z" onclick="selectRegion('groot')"/>
            <text x="125" y="125" class="region-label">Groot-Bijgaarden</text>
            <path id="region-zellik" class="region-path" d="M 190,70 L 320,60 L 290,140 L 170,160 Z" onclick="selectRegion('zellik')"/>
            <text x="240" y="110" class="region-label">Zellik (1730)</text>
            <path id="region-molenbeek" class="region-path" d="M 170,160 L 290,140 L 340,230 L 210,240 Z" onclick="selectRegion('molenbeek')"/>
            <text x="255" y="195" class="region-label">Molenbeek (1080)</text>
            <path id="region-anderlecht" class="region-path" d="M 210,240 L 340,230 L 310,340 L 160,330 Z" onclick="selectRegion('anderlecht')"/>
            <text x="250" y="285" class="region-label">Anderlecht (1070)</text>
        </svg>
    </div>

    <div class="bottom-sheet">
        <div class="sheet-handle"></div>
        <div class="stats-header">
            <div>
                <div class="stats-title">Selected Region</div>
                <div class="selected-region-name" id="region-title">Dilbeek (1700)</div>
            </div>
            <div class="main-stat">
                <span class="user-val" id="user-val" style="color: #2997FF;">1,231</span>
                <span class="user-unit">kWh</span>
                <div style="font-size: 10px; color: #8E8E93; margin-top: 2px;">Your Usage</div>
            </div>
        </div>

        <div class="bar-container">
            <div class="bar-bg"><div class="bar-fill" id="progress-bar"></div></div>
            <div class="bar-labels">
                <span>Lower use</span>
                <span id="region-avg-label">Dilbeek avg: 2,837 kWh</span>
            </div>
        </div>

        <div class="badges-grid">
            <div class="badge-card" id="card-region">
                <div class="badge-value" id="badge-region-val">↓ 57%</div>
                <div class="badge-sub" id="badge-region-sub">below Dilbeek avg</div>
            </div>
            <div class="badge-card" id="card-flanders">
                <div class="badge-value" id="badge-flanders-val">↓ 53%</div>
                <div class="badge-sub">below Flanders avg</div>
            </div>
        </div>

        <div class="legend">
            <span>Low Use</span>
            <div class="legend-gradient" id="legend-grad"></div>
            <span>High Use</span>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zM16.2 13H19v6h-2.8z"/></svg>
            <span>Charts</span>
        </div>
        <div class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            <span>Compare</span>
        </div>
    </div>
</div>

<script>
    const regionData = {
        dilbeek: { name: "Dilbeek (1700)", elecAvg: 2837, userElec: 1231, gasAvg: 13194, userGas: 5055, elecColor: "rgba(48, 209, 88, 0.45)", gasColor: "rgba(255, 159, 10, 0.45)", elecStroke: "#30D158", gasStroke: "#FF9F0A" },
        groot: { name: "Groot-Bijgaarden (1702)", elecAvg: 2710, userElec: 1231, gasAvg: 12800, userGas: 5055, elecColor: "rgba(52, 199, 89, 0.35)", gasColor: "rgba(255, 179, 64, 0.35)", elecStroke: "#34C759", gasStroke: "#FFB340" },
        zellik: { name: "Zellik (1730)", elecAvg: 2950, userElec: 1231, gasAvg: 13850, userGas: 5055, elecColor: "rgba(10, 132, 255, 0.35)", gasColor: "rgba(255, 105, 0, 0.45)", elecStroke: "#0A84FF", gasStroke: "#FF6900" },
        molenbeek: { name: "Molenbeek (1080)", elecAvg: 2150, userElec: 1231, gasAvg: 9800, userGas: 5055, elecColor: "rgba(48, 209, 88, 0.55)", gasColor: "rgba(255, 214, 10, 0.35)", elecStroke: "#30D158", gasStroke: "#FFD60A" },
        anderlecht: { name: "Anderlecht (1070)", elecAvg: 2450, userElec: 1231, gasAvg: 11200, userGas: 5055, elecColor: "rgba(52, 199, 89, 0.4)", gasColor: "rgba(255, 159, 10, 0.35)", elecStroke: "#34C759", gasStroke: "#FF9F0A" }
    };

    const flandersElecAvg = 2636, flandersGasAvg = 11182;
    let currentEnergyType = 'electricity', currentSelectedRegion = 'dilbeek';

    updateMapColors();
    updateUI();

    function setEnergyType(type) {
        currentEnergyType = type;
        document.getElementById('btn-elec').classList.toggle('active', type === 'electricity');
        document.getElementById('btn-gas').classList.toggle('active', type === 'gas');
        updateMapColors();
        updateUI();
    }

    function selectRegion(regionKey) {
        currentSelectedRegion = regionKey;
        updateMapColors();
        updateUI();
    }

    function updateMapColors() {
        Object.keys(regionData).forEach(key => {
            const path = document.getElementById(`region-${key}`);
            const data = regionData[key];
            const isSelected = (key === currentSelectedRegion);
            const fillColor = (currentEnergyType === 'electricity') ? data.elecColor : data.gasColor;
            const strokeColor = (currentEnergyType === 'electricity') ? data.elecStroke : data.gasStroke;

            path.setAttribute('fill', fillColor);
            path.setAttribute('stroke', strokeColor);
            path.setAttribute('stroke-width', isSelected ? "3.5" : "1.5");
            path.style.filter = isSelected ? `drop-shadow(0 0 10px ${strokeColor})` : "none";
        });

        const legendGrad = document.getElementById('legend-grad');
        legendGrad.style.background = (currentEnergyType === 'electricity') 
            ? 'linear-gradient(90deg, #30D158, #0A84FF, #5E5CE6)' 
            : 'linear-gradient(90deg, #30D158, #FFD60A, #FF9F0A, #FF453A)';
    }

    function updateUI() {
        const region = regionData[currentSelectedRegion];
        const isElec = currentEnergyType === 'electricity';
        const userVal = isElec ? region.userElec : region.userGas;
        const avgVal = isElec ? region.elecAvg : region.gasAvg;
        const flandersAvg = isElec ? flandersElecAvg : flandersGasAvg;

        document.getElementById('region-title').textContent = region.name;
        const userValEl = document.getElementById('user-val');
        userValEl.textContent = userVal.toLocaleString();
        userValEl.style.color = isElec ? "#2997FF" : "#FF9F0A";

        const pctOfAvg = Math.min(Math.round((userVal / avgVal) * 100), 100);
        const progressBar = document.getElementById('progress-bar');
        progressBar.style.width = `${pctOfAvg}%`;
        progressBar.style.backgroundColor = isElec ? "#30D158" : "#FF9F0A";

        document.getElementById('region-avg-label').textContent = `${region.name.split(' ')[0]} avg: ${avgVal.toLocaleString()} kWh`;

        const vsRegionPct = Math.round(((avgVal - userVal) / avgVal) * 100);
        const vsFlandersPct = Math.round(((flandersAvg - userVal) / flandersAvg) * 100);

        const badgeRegionVal = document.getElementById('badge-region-val');
        const badgeRegionSub = document.getElementById('badge-region-sub');
        const cardRegion = document.getElementById('card-region');

        if (vsRegionPct >= 0) {
            badgeRegionVal.textContent = `↓ ${vsRegionPct}%`;
            badgeRegionSub.textContent = `below ${region.name.split(' ')[0]} avg`;
            cardRegion.classList.remove('amber');
        } else {
            badgeRegionVal.textContent = `↑ ${Math.abs(vsRegionPct)}%`;
            badgeRegionSub.textContent = `above ${region.name.split(' ')[0]} avg`;
            cardRegion.classList.add('amber');
        }

        document.getElementById('badge-flanders-val').textContent = vsFlandersPct >= 0 ? `↓ ${vsFlandersPct}%` : `↑ ${Math.abs(vsFlandersPct)}%`;
    }
</script>
</body>
</html>
